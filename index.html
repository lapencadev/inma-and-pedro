<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Inma & Pedro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="container">

  <div class="header">
    <h1>INMA & PEDRO</h1>
    <p>Destino final · 15 · 08 · 2026</p>
  </div>

  <div class="countdown-wrap" id="countdownWrap">
    <div class="milestone-badge" id="milestoneBadge" aria-live="polite" hidden></div>

    <div class="countdown">
      <div class="time-box">
        <div class="number" id="days">0</div>
        <div class="label">Días</div>
      </div>
      <div class="time-box">
        <div class="number" id="hours">0</div>
        <div class="label">Horas</div>
      </div>
      <div class="time-box">
        <div class="number" id="minutes">0</div>
        <div class="label">Minutos</div>
      </div>
      <div class="time-box">
        <div class="number" id="seconds">0</div>
        <div class="label">Segundos</div>
      </div>
    </div>

    <section class="monthly-egg" id="monthlyEgg" aria-live="polite"></section>

    <div class="travel-text" id="travelText"></div>
  </div>

  <section class="celebration" id="celebration" aria-live="polite" hidden></section>

  <section class="despedida" id="despedida">
    <button class="despedida-toggle" id="despedidaToggle" aria-expanded="false">
      <span class="despedida-arrow">👀✨💖</span>
    </button>
    <div class="despedida-gallery" id="despedidaGallery" hidden>
      <div class="gallery-track" id="galleryTrack">
        <img src="fotos/foto1.jpg" alt="Despedida 1" loading="lazy" />
        <img src="fotos/foto2.jpg" alt="Despedida 2" loading="lazy" />
        <img src="fotos/foto3.jpg" alt="Despedida 3" loading="lazy" />
        <img src="fotos/foto4.jpg" alt="Despedida 4" loading="lazy" />
        <img src="fotos/foto5.jpg" alt="Despedida 5" loading="lazy" />
        <img src="fotos/foto6.jpg" alt="Despedida 6" loading="lazy" />
        <img src="fotos/foto7.jpg" alt="Despedida 7" loading="lazy" />
        <img src="fotos/foto8.jpg" alt="Despedida 8" loading="lazy" />
        <img src="fotos/foto9.jpg" alt="Despedida 9" loading="lazy" />
        <img src="fotos/foto10.jpg" alt="Despedida 10" loading="lazy" />
        <img src="fotos/foto11.jpg" alt="Despedida 11" loading="lazy" />
        <img src="fotos/foto12.jpg" alt="Despedida 12" loading="lazy" />
        <img src="fotos/foto13.jpg" alt="Despedida 13" loading="lazy" />
        <img src="fotos/foto14.jpg" alt="Despedida 14" loading="lazy" />
      </div>
      <button class="gallery-nav gallery-prev" aria-label="Anterior">&#8592;</button>
      <button class="gallery-nav gallery-next" aria-label="Siguiente">&#8594;</button>
    </div>
  </section>

</div>

  <div class="footer-logo">
    <img src="comite-inma-sf.png" alt="Comite Inma" />
  </div>

<script src="script.js"></script>

</body>
</html>
